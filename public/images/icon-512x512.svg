<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#iconGradient512)"/>
  
  <!-- QR Code representation -->
  <g fill="white">
    <!-- Top-left corner -->
    <rect x="86" y="86" width="112" height="112" rx="16"/>
    <rect x="112" y="112" width="60" height="60" fill="#2563eb"/>
    
    <!-- Top-right corner -->
    <rect x="314" y="86" width="112" height="112" rx="16"/>
    <rect x="340" y="112" width="60" height="60" fill="#2563eb"/>
    
    <!-- Bottom-left corner -->
    <rect x="86" y="314" width="112" height="112" rx="16"/>
    <rect x="112" y="340" width="60" height="60" fill="#2563eb"/>
    
    <!-- Center pattern -->
    <rect x="228" y="228" width="56" height="56" rx="8"/>
    
    <!-- Data pattern - creating a more detailed QR-like pattern -->
    <!-- Row 1 -->
    <rect x="224" y="86" width="28" height="28"/>
    <rect x="256" y="86" width="28" height="28"/>
    <rect x="288" y="86" width="28" height="28"/>
    
    <!-- Row 2 -->
    <rect x="224" y="118" width="28" height="28"/>
    <rect x="288" y="118" width="28" height="28"/>
    
    <!-- Row 3 -->
    <rect x="202" y="150" width="28" height="28"/>
    <rect x="234" y="150" width="28" height="28"/>
    <rect x="266" y="150" width="28" height="28"/>
    <rect x="298" y="150" width="28" height="28"/>
    
    <!-- Row 4 -->
    <rect x="202" y="182" width="28" height="28"/>
    <rect x="266" y="182" width="28" height="28"/>
    <rect x="298" y="182" width="28" height="28"/>
    
    <!-- Middle rows -->
    <rect x="86" y="224" width="28" height="28"/>
    <rect x="118" y="224" width="28" height="28"/>
    <rect x="150" y="224" width="28" height="28"/>
    <rect x="182" y="224" width="28" height="28"/>
    <rect x="314" y="224" width="28" height="28"/>
    <rect x="346" y="224" width="28" height="28"/>
    <rect x="378" y="224" width="28" height="28"/>
    <rect x="410" y="224" width="28" height="28"/>
    
    <rect x="86" y="256" width="28" height="28"/>
    <rect x="150" y="256" width="28" height="28"/>
    <rect x="314" y="256" width="28" height="28"/>
    <rect x="378" y="256" width="28" height="28"/>
    
    <!-- Bottom pattern -->
    <rect x="224" y="314" width="28" height="28"/>
    <rect x="256" y="314" width="28" height="28"/>
    <rect x="288" y="314" width="28" height="28"/>
    
    <rect x="224" y="346" width="28" height="28"/>
    <rect x="288" y="346" width="28" height="28"/>
    
    <rect x="202" y="378" width="28" height="28"/>
    <rect x="234" y="378" width="28" height="28"/>
    <rect x="266" y="378" width="28" height="28"/>
    <rect x="298" y="378" width="28" height="28"/>
    
    <rect x="224" y="410" width="28" height="28"/>
    <rect x="256" y="410" width="28" height="28"/>
  </g>
