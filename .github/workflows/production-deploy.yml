name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkgenerus-production
  cancel-in-progress: false

jobs:
  test:
    name: Test release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, gd, pdo_sqlite, pdo_mysql, curl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer validate --strict --no-interaction
      - name: Prepare Laravel runtime directories
        run: |
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/app/public
          mkdir -p storage/logs
          mkdir -p bootstrap/cache
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Create isolated Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
      - name: Run tests with isolated environment
        env:
          APP_ENV: testing
          APP_DEBUG: "true"
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          TELESCOPE_ENABLED: "false"
        run: php artisan test

  deploy:
    name: Deploy approved production release
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pkgenerus.my.id
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST is required.}"
          : "${DEPLOY_USER:?DEPLOY_USER is required.}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required.}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS is required.}"
          port="${DEPLOY_PORT:-22}"
          case "$port" in
            *[!0-9]* | '') echo "DEPLOY_PORT must be an integer from 1 to 65535." >&2; exit 1 ;;
          esac
          if [ "$port" -lt 1 ] || [ "$port" -gt 65535 ]; then
            echo "DEPLOY_PORT must be an integer from 1 to 65535." >&2
            exit 1
          fi
          case "$DEPLOY_USER" in
            *[!A-Za-z0-9_-]* | '') echo "DEPLOY_USER contains unsupported characters." >&2; exit 1 ;;
          esac
          case "$DEPLOY_HOST" in
            -* | *[!A-Za-z0-9._:-]* | '') echo "DEPLOY_HOST contains unsupported characters." >&2; exit 1 ;;
          esac
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Create isolated release directory
        id: release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_NAME: ${{ github.sha }}
        run: |
          port="${DEPLOY_PORT:-22}"
          ssh -p "$port" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -eu; test -f /var/www/pkgenerus.my.id/shared/.env; mkdir -p /var/www/pkgenerus.my.id/releases; test ! -e /var/www/pkgenerus.my.id/releases/$RELEASE_NAME; mkdir /var/www/pkgenerus.my.id/releases/$RELEASE_NAME"
          echo "name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload release source
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
        run: |
          port="${DEPLOY_PORT:-22}"
          rsync -az --delete \
            --exclude='/.env' \
            --exclude='/.git/' \
            --exclude='/vendor/' \
            --exclude='/node_modules/' \
            --exclude='/storage/' \
            --exclude='/public/storage' \
            -e "ssh -p $port" ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/pkgenerus.my.id/releases/$RELEASE_NAME/"
      - name: Build and activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
        run: |
          port="${DEPLOY_PORT:-22}"
          ssh -p "$port" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash /var/www/pkgenerus.my.id/releases/$RELEASE_NAME/scripts/vps/deploy-release.sh $RELEASE_NAME"
